# Fly.io configuration — https://fly.io/docs/reference/configuration/
#
# Deploy:
#   fly launch --copy-config --no-deploy   # change `app` to a unique name
#   fly volumes create allin1_data --size 1
#   fly deploy
app = "allin1-media"          # <- must be globally unique; change this
primary_region = "sin"        # Singapore is the closest region to Dubai

[build]
  dockerfile = "Dockerfile"

[env]
  ALLIN1_DATA_DIR = "/app/data"
  PORT = "8000"
  WEB_CONCURRENCY = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# Persistent volume so history and media survive restarts.
[[mounts]]
  source = "allin1_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
