# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo, then in Render choose
#   New +  ->  Blueprint  ->  pick this repository.
#
# Note: the free plan has no persistent disk, so download history resets on
# each deploy. Add a Disk (paid) mounted at /app/data to make it durable.
services:
  - type: web
    name: allin1
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ALLIN1_DATA_DIR
        value: /app/data
      - key: ALLIN1_CORS_ORIGINS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "1"
