# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo, then in Render choose
#   New +  ->  Blueprint  ->  pick this repository.
#
# Note: the free plan has no persistent disk, so download history resets on
# each deploy. Add a Disk (paid) mounted at /app/data to make it durable.
services:
  - type: web
    name: allin1
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ALLIN1_DATA_DIR
        value: /app/data
      - key: ALLIN1_CORS_ORIGINS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "1"
      # Render generates a strong key on first deploy: open the service in the
      # dashboard -> Environment -> copy ALLIN1_API_KEY, then paste it into the
      # app's key dialog. Your public URL is not usable without it.
      - key: ALLIN1_API_KEY
        generateValue: true
      # Keep one visitor's download from filling the disk, and clean up after a day.
      - key: ALLIN1_MAX_DOWNLOAD_MB
        value: "2048"
      - key: ALLIN1_FILE_TTL_HOURS
        value: "24"
